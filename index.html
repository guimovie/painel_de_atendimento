<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Atendimento</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="shortcut icon" href="style/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <h1>Bendito Café</h1>
    </header>
    <main>
        <div class="box" id="chamada" style="grid-area: box-1;">
            <button id="pedido-btn">Fazer Pedido</button>
            <button id="limpar-btn">Limpar Pedidos</button>
        </div>
        <div class="box" id="video" style="grid-area: box-2;">
            <h2>video</h2>
        </div>
        <div class="box" id="historico" style="grid-area: box-5;">
            <h2>Histórico de chamadas:</h2>
            <div id="historico-lista"></div>
        </div>
        <div class="box" id="preparacao" style="grid-area: box-3;">
            <h2>Preparação:</h2>
            <div id="preparacao-lista"></div>
        </div>
        <div class="box" id="pronto" style="grid-area: box-4;">
            <div id="pronto-lista">
                <h2>Pronto</h2>
            </div>
        </div>
    </main>
    <footer>
        <p>Desenvolvido por <a href="https://github.com/guimovie" target="_blank" rel="noopener noreferrer"
>
  GUIMOVIE
</a></p>
    </footer>
    <script src="script/script.js"></script>
</body>
</html>
